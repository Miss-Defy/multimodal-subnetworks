# resnet3d_gender_bn_64base_2.2.2.2_exp01.yaml

mongo:
  host: "10.245.12.58"
  host_slurm: "arctrdcn018.rs.gsu.edu"
  validation_percent: 0.2
  index_id: "id"
  
wandb:
  team: "neuroneural"  
  project: "holographic_project"  

bit16: False

model:
  # config_file: /data/users2/jwardell1/multimodal-subnetworks/conf/resnet3d_gender_bn_64base_2.2.2.2_exp01.yaml
  masked: False
  sparsity: 0.7  
  snip_batch_size: 20
  n_classes: 1  # Binary gender classification
  model_channels: 64  # ResNet base channels
  init_weights_path: ""
  model_init_seed: 1997
  model_label: "_resnet3d_gender_64base"
  volume_shape: [256, 256, 256]
  maxshape: 300
  optimize_inline: False
  # Normalisation to use in ResNet3D.                               ### 20260630
  # Options: "batchnorm" | "groupnorm" | "modalbatchnorm"
  #   batchnorm      — standard nn.BatchNorm3d (original behaviour)
  #   groupnorm      — nn.GroupNorm, one group per channel, no affine params
  #   modalbatchnorm — separate BatchNorm3d per modality (fALFF / sMRI / DWI)
  norm_type: "batchnorm"                                            ### 20260630
  use_me: True  
  loss_weight: [0.5, 0.5]  

paths:
  loadcheckpoint: False
  logdir: "./logs/" 
#  model: "/home/users/elatash1/Work/Joanne_Multimodal/multimodal-subnetworks-main-groupnorm-claude/slurm_scripts/logs/ukb_multimodal_lz4_sps0.5_ukb_('falff', 'smri', 'dwi')_('gender_encoded',)_masked_True_sps_0.5/fold_0/model.best.pth"


client_creator:
  crop_tensor: False
  normalize: False  

experiment:
  experiment_name: test 
  cv_seed: 42
  cv_folds: 10
  max_folds: null
  lr_scale: 0.01
  cubesizes: 256
  numcubes: 1
  numvolumes: 8
  weights: 1
  databases: "multimodalSubnetworks"
  collections: "fbirn"
  dbfields: ["falff"]
  metafields: ["gender_encoded"]
  epochs: 100
  max_subjects: null   # Set to null or an integer (e.g. 100) to cap the subject pool for quick tests
  prefetches: 16
  num_workers: 12
  prefetch_factor: 4
  train_prefetches: null
  train_num_workers: null
  train_prefetch_factor: null
  train_persistent_workers: True
  eval_prefetches: null
  eval_num_workers: null
  eval_prefetch_factor: null
  eval_persistent_workers: True
  profile_timings: False
  timing_sync_cuda: True
  cudnn_benchmark: True
  attenuates: 0.8

resnet_specific:
  block_type: "basic"
  layers: [2, 2, 2, 2]  
  initial_stride: 2
  initial_kernel: 7
  initial_pool: True
  dropout: 0.2
  use_checkpointing: False
